<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14202e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wave">
  <title>Powerlifting Wave</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="view"></main>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="bar-steel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d7dee5"/>
        <stop offset="1" stop-color="#7d8a97"/>
      </linearGradient>
    </defs>
  </svg>

  <aside class="rest" id="rest" aria-label="Rest timer" hidden>
    <span class="rest-track" aria-hidden="true"><span class="rest-fill" id="rest-fill"></span></span>
    <span class="rest-time" id="rest-time" role="timer">0:00</span>
    <span class="rest-label" id="rest-label" aria-live="polite">Rest</span>
    <button class="rest-btn rest-add" data-action="rest-add">+30 s</button>
    <button class="rest-btn rest-stop" data-action="rest-stop">Done</button>
    <span class="rest-next" id="rest-next"></span>
  </aside>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button class="tab" data-action="tab" data-tab="train">Train</button>
    <button class="tab" data-action="tab" data-tab="prs">PRs</button>
    <button class="tab" data-action="tab" data-tab="history">History</button>
    <button class="tab" data-action="tab" data-tab="settings">Settings</button>
  </nav>

  <dialog class="sheet" id="reps-sheet" aria-labelledby="reps-title">
    <div class="sheet-body">
      <h2 class="sheet-title" id="reps-title"></h2>
      <p class="sheet-note" id="reps-note"></p>
      <div class="field sheet-weight" id="reps-weight-field" hidden>
        <span class="field-label" id="reps-weight-label">Weight</span>
        <div class="load" aria-labelledby="reps-weight-label"></div>
      </div>
      <div class="rep-grid" id="rep-grid"></div>
      <div class="pad" role="group" aria-label="Keypad" data-done="Done" hidden></div>
      <div class="sheet-actions">
        <button class="btn-quiet" data-action="reps-clear">Clear set</button>
        <button class="btn-quiet" data-action="sheet-close">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="weight-sheet" aria-labelledby="weight-title">
    <div class="sheet-body">
      <h2 class="sheet-title" id="weight-title"></h2>
      <p class="sheet-note" id="weight-note"></p>
      <div class="field sheet-weight">
        <span class="field-label" id="weight-label">Weight on the bar</span>
        <div class="load" aria-labelledby="weight-label"></div>
      </div>
      <div class="pad" role="group" aria-label="Keypad" data-done="Save"></div>
      <div class="sheet-actions">
        <button class="btn-quiet" data-action="weight-reset">Use target</button>
        <button class="btn-quiet" data-action="sheet-close">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="pick-sheet" aria-labelledby="pick-title">
    <div class="sheet-body">
      <h2 class="sheet-title" id="pick-title">Add an exercise</h2>
      <p class="sheet-note" id="pick-note"></p>
      <div class="pick-list" id="pick-list"></div>
      <div class="sheet-actions">
        <button class="btn-quiet" data-action="exercise-new">New exercise</button>
        <button class="btn-quiet" data-action="sheet-close">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="past-sheet" aria-labelledby="past-title">
    <form class="sheet-body" id="past-form" novalidate>
      <h2 class="sheet-title" id="past-title">Add an earlier max</h2>
      <p class="sheet-note">A max from before you used the app, or one you hit outside the program, so History and PRs have it.</p>
      <label class="field">
        <span class="field-label">Lift</span>
        <span class="field-row"><select class="text-input select-input" name="lift" id="past-lift"></select></span>
      </label>
      <div class="field-grid">
        <label class="field">
          <span class="field-label">Max</span>
          <span class="field-row"><input class="num-input num-small" name="value" type="number" inputmode="decimal" step="any" min="0"><span class="field-unit" id="past-unit"></span></span>
        </label>
        <label class="field">
          <span class="field-label">Date</span>
          <span class="field-row"><input class="text-input date-input" name="date" type="date"></span>
        </label>
      </div>
      <div class="sheet-actions">
        <button class="btn-quiet" type="button" data-action="past-delete" id="past-delete">Delete</button>
        <span class="sheet-actions-end">
          <button class="btn-quiet" type="button" data-action="sheet-close">Cancel</button>
          <button class="btn" type="submit">Save</button>
        </span>
      </div>
    </form>
  </dialog>
  <dialog class="sheet" id="exercise-sheet" aria-labelledby="exercise-title">
    <form class="sheet-body exercise-form" id="exercise-form" novalidate>
      <h2 class="sheet-title" id="exercise-title">New exercise</h2>
      <label class="field">
        <span class="field-label">Name</span>
        <span class="field-row"><input class="text-input" name="name" maxlength="60" autocomplete="off" placeholder="Shoulder press"></span>
      </label>
      <label class="field">
        <span class="field-label">Variants, separated by commas (optional)</span>
        <span class="field-row"><input class="text-input" name="variants" maxlength="200" autocomplete="off" placeholder="Dumbbell, Machine"></span>
      </label>
      <div class="field-grid">
        <label class="field">
          <span class="field-label">Sets</span>
          <span class="field-row"><input class="num-input num-small" name="sets" type="number" inputmode="numeric" min="1" max="10"></span>
        </label>
        <label class="field">
          <span class="field-label">Reps from</span>
          <span class="field-row"><input class="num-input num-small" name="low" type="number" inputmode="numeric" min="1" max="50"></span>
        </label>
        <label class="field">
          <span class="field-label">to</span>
          <span class="field-row"><input class="num-input num-small" name="high" type="number" inputmode="numeric" min="1" max="50"></span>
        </label>
      </div>
      <div class="field-grid">
        <label class="field">
          <span class="field-label">Weight jump</span>
          <span class="field-row"><input class="num-input num-small" name="step" type="number" inputmode="decimal" step="any" min="0"><span class="field-unit" id="exercise-unit"></span></span>
        </label>
        <label class="field">
          <span class="field-label">Rest, seconds</span>
          <span class="field-row"><input class="num-input num-small" name="restSeconds" type="number" inputmode="numeric" min="15" max="900"></span>
        </label>
      </div>
      <fieldset class="day-pick">
        <legend class="field-label">Shows up on</legend>
        <div class="day-boxes" id="exercise-days"></div>
      </fieldset>
      <label class="field">
        <span class="field-label">Superset with (optional)</span>
        <span class="field-row"><select class="text-input select-input" name="link" id="exercise-link"></select></span>
      </label>
      <label class="field">
        <span class="field-label">Muscle it counts toward</span>
        <span class="field-row"><select class="text-input select-input" name="muscle" id="exercise-muscle"></select></span>
      </label>
      <label class="field">
        <span class="field-label">Plates</span>
        <span class="field-row"><select class="text-input select-input" name="plates" id="exercise-plates"></select></span>
      </label>
      <fieldset class="pic-pick">
        <legend class="field-label">Picture</legend>
        <div class="pic-grid" id="exercise-pics"></div>
      </fieldset>
      <div class="sheet-actions">
        <button class="btn-quiet" type="button" data-action="exercise-delete" id="exercise-delete">Delete</button>
        <span class="sheet-actions-end">
          <button class="btn-quiet" type="button" data-action="sheet-close">Cancel</button>
          <button class="btn" type="submit">Save</button>
        </span>
      </div>
    </form>
  </dialog>

  <input type="file" id="restore-input" accept=".json,application/json,text/plain" hidden>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</body>
</html>
