<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14202e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wave">
  <title>Powerlifting Wave</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="view"></main>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button class="tab" data-action="tab" data-tab="train">Train</button>
    <button class="tab" data-action="tab" data-tab="history">History</button>
    <button class="tab" data-action="tab" data-tab="settings">Settings</button>
  </nav>

  <dialog class="sheet" id="reps-sheet" aria-labelledby="reps-title">
    <div class="sheet-body">
      <h2 class="sheet-title" id="reps-title"></h2>
      <p class="sheet-note" id="reps-note"></p>
      <div class="rep-grid" id="rep-grid"></div>
      <div class="sheet-actions">
        <button class="btn-quiet" data-action="reps-clear">Clear set</button>
        <button class="btn-quiet" data-action="sheet-close">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="weight-sheet" aria-labelledby="weight-title">
    <div class="sheet-body">
      <h2 class="sheet-title" id="weight-title"></h2>
      <p class="sheet-note" id="weight-note"></p>
      <label class="field">
        <span class="field-label">Weight on the bar</span>
        <span class="field-row">
          <input class="num-input" id="weight-input" type="number" inputmode="decimal" step="any" min="0">
          <span class="field-unit" id="weight-unit"></span>
        </span>
      </label>
      <div class="sheet-actions">
        <button class="btn-quiet" data-action="weight-reset">Use target</button>
        <button class="btn" data-action="weight-save">Save weight</button>
      </div>
    </div>
  </dialog>

  <input type="file" id="restore-input" accept=".json,application/json,text/plain" hidden>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</body>
</html>
